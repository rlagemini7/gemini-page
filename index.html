<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemini 이미지 생성기 (병렬 1~10, 고정 배치)</title>
<style>
  :root { --fg:#111; --muted:#666; --bg:#fff; --b:#ddd; --err:#c00; --hi:#06c; }
  body{font-family:system-ui, Roboto, Arial; color:var(--fg); background:var(--bg); max-width:980px;margin:auto;padding:16px}
  .row{display:flex;gap:.5rem;flex-wrap:wrap;margin:.75rem 0;align-items:center}
  .btn, select, input[type="text"]{padding:.6rem .9rem;border:1px solid var(--b);border-radius:10px;background:#fff;color:#000}
  .btn{cursor:pointer}
  .btn[disabled]{opacity:.5;cursor:default}
  textarea{width:100%;font-family:monospace}
  #prompt{min-height:110px}
  #b64{min-height:140px}
  #raw{min-height:220px}
  fieldset{border:1px solid var(--b);border-radius:12px;padding:10px}
  legend{padding:0 6px;color:#333}
  label.slab{display:flex;gap:8px;align-items:center;min-width:200px;justify-content:space-between}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
  .hint{font-size:.9rem;color:#666}
  #status{white-space:pre-wrap;max-width:520px}
  #status.err{color:var(--err)}
  #status.ok{color:var(--muted)}

  #viewer{border:1px solid var(--b);border-radius:10px;min-height:240px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:.5rem}
  #viewer img{max-width:100%;max-height:70vh}

  #gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:8px}
  .card{position:relative;border:1px solid var(--b);border-radius:10px;overflow:hidden;background:#fff;cursor:pointer}
  .card img{display:block;width:100%;height:140px;object-fit:cover}
  .card .meta{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;font-size:.9rem}
  .badge{font-size:.75rem;color:#fff;background:var(--hi);padding:2px 6px;border-radius:999px}
  .card.sel{outline:2px solid var(--hi)}

  .raw-nav{display:flex;align-items:center;gap:.5rem}
  .raw-nav .navbtn{min-width:44px}

  #refStrip{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:4px}
  .refthumb{width:72px;height:72px;object-fit:cover;border:1px solid var(--b);border-radius:8px;flex:0 0 auto}
</style>
<body>
  <h2>Gemini 이미지 생성기</h2>

  <div class="row">
    <input id="endpoint" type="text" placeholder="https://<Cloud-Run-URL>" style="flex:2;min-width:240px">
    <input id="token" type="text" placeholder="(선택) Bearer 토큰" style="flex:1;min-width:160px">
  </div>

  <div class="row">
    <input id="file" type="file" accept="image/*" multiple class="btn">
    <label class="slab"><input id="shrink" type="checkbox"> 512px로 축소</label>
    <button id="clearRefs" class="btn">참조 초기화</button>
    <span id="refCount" class="hint"></span>
  </div>
  <div id="refStrip"></div>

  <label for="prompt">프롬프트</label>
  <textarea id="prompt"></textarea>

  <div class="row">
    <button id="genz-e" class="btn">e→3</button>
    <button id="genz-g" class="btn">g→8</button>
    <button id="genz-l" class="btn">l→1</button>
    <button id="genz-s" class="btn">s→5</button>
    <button id="genz-o" class="btn">o→0</button>
    <button id="genz-a" class="btn">a→4</button>
    <button id="genz-1337" class="btn">1337 변환</button>
    <button id="genz-reset" class="btn">처음으로</button>
  </div>

  <fieldset>
    <legend>안전 설정</legend>
    <div class="grid">
      <label class="slab">Harassment <select id="s-HARASSMENT"></select></label>
      <label class="slab">Hate speech <select id="s-HATE_SPEECH"></select></label>
      <label class="slab">Sexual <select id="s-SEXUALLY_EXPLICIT"></select></label>
      <label class="slab">Dangerous <select id="s-DANGEROUS_CONTENT"></select></label>
      <label class="slab">Civic <select id="s-CIVIC_INTEGRITY"></select></label>
    </div>
  </fieldset>

  <div class="row">
    <label class="slab">IMAGE_SAFETY 재시도
      <select id="retryImageSafety">
        <option>0</option><option>1</option><option>2</option><option>3</option><option>4</option>
        <option>5</option><option>6</option><option>7</option><option>8</option><option>9</option>
      </select>
    </label>

    <label class="slab"><input id="multiMode" type="checkbox"> 연속생성 모드</label>

    <label class="slab">목표 장수
      <select id="multiCount">
        <option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option>
        <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
      </select>
    </label>

    <label class="slab">병렬
      <select id="parallelCount">
        <option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option>
        <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
      </select>
    </label>
  </div>

  <div class="row">
    <button id="go" class="btn">이미지 만들기</button>
    <button id="stop" class="btn" disabled>정지</button>
    <button id="save" class="btn" disabled>선택 저장</button>
    <button id="copyB64" class="btn" disabled>선택 Base64</button>
    <button id="openDataUrl" class="btn" disabled>선택 새 탭</button>
    <span id="spin" style="display:none">⏳ 생성 중</span>
    <span id="status"></span>
  </div>

  <div class="row raw-nav">
    <button id="navNewer" class="btn navbtn" title="더 최신">◀</button>
    <label for="raw" style="font-weight:600">원시 응답(raw)</label>
    <button id="navOlder" class="btn navbtn" title="더 과거">▶</button>
  </div>
  <textarea id="raw" readonly></textarea>

  <div id="viewer"><div style="color:#888">아직 결과 없음</div></div>

  <div class="row">
    <strong>결과 그리드</strong>
    <div style="flex:1"></div>
    <button id="clearGallery" class="btn">모두 지우기</button>
  </div>
  <div id="gallery"></div>

  <label for="b64">선택 항목 Base64</label>
  <textarea id="b64" readonly></textarea>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const refs = {
    endpoint: $('endpoint'), token: $('token'),
    file: $('file'), shrink: $('shrink'), clearRefs: $('clearRefs'), refStrip: $('refStrip'), refCount: $('refCount'),
    prompt: $('prompt'),
    go: $('go'), stop: $('stop'),
    save: $('save'), copyB64: $('copyB64'), openDataUrl: $('openDataUrl'),
    spin: $('spin'), status: $('status'),
    viewer: $('viewer'), b64: $('b64'), raw: $('raw'),
    retrySafetySel: $('retryImageSafety'),
    multiMode: $('multiMode'), multiCount: $('multiCount'), parallelCount: $('parallelCount'),
    gallery: $('gallery'), clearGallery: $('clearGallery'),
    navNewer: $('navNewer'), navOlder: $('navOlder'),
    s: {
      HARASSMENT: $('s-HARASSMENT'),
      HATE_SPEECH: $('s-HATE_SPEECH'),
      SEXUALLY_EXPLICIT: $('s-SEXUALLY_EXPLICIT'),
      DANGEROUS_CONTENT: $('s-DANGEROUS_CONTENT'),
      CIVIC_INTEGRITY: $('s-CIVIC_INTEGRITY')
    },
    genz: {
      e:$('genz-e'), g:$('genz-g'), l:$('genz-l'),
      s:$('genz-s'), o:$('genz-o'), a:$('genz-a'),
      leet:$('genz-1337'), reset:$('genz-reset')
    }
  };

  const SAFETY_OPTIONS = [
    ["", "기본"], ["OFF", "OFF"], ["BLOCK_ONLY_HIGH", "HIGH↑"],
    ["BLOCK_MEDIUM_AND_ABOVE", "MED↑"], ["BLOCK_LOW_AND_ABOVE", "LOW↑"],
    ["HARM_BLOCK_THRESHOLD_UNSPECIFIED", "미지정"]
  ];
  Object.values(refs.s).forEach(sel => {
    sel.innerHTML = SAFETY_OPTIONS.map(([v,l]) => `<option value="${v}">${l}</option>`).join('');
    sel.value = "OFF";
  });

  let genzOriginal = null;
  function ensureOriginal(){ if (genzOriginal === null) genzOriginal = refs.prompt.value; }
  function applyGenZ(mapper){ ensureOriginal(); refs.prompt.value = mapper(refs.prompt.value); }

  refs.genz.e.onclick = () => applyGenZ(s => s.replace(/e/g, "3"));
  refs.genz.g.onclick = () => applyGenZ(s => s.replace(/g/g, "8"));
  refs.genz.l.onclick = () => applyGenZ(s => s.replace(/l/g, "1"));
  refs.genz.s.onclick = () => applyGenZ(s => s.replace(/s/g, "5"));
  refs.genz.o.onclick = () => applyGenZ(s => s.replace(/o/g, "0"));
  refs.genz.a.onclick = () => applyGenZ(s => s.replace(/a/g, "4"));
  refs.genz.leet.onclick = () => applyGenZ(s => {
    const m = {a:'4', b:'8', e:'3', g:'6', i:'1', l:'1', o:'0', s:'5', t:'7', z:'2'};
    return s.replace(/[ABEGILOSTZabegilostz]/g, ch => m[ch.toLowerCase()] || ch);
  });
  refs.genz.reset.onclick = () => {
    if (genzOriginal !== null) {
      refs.prompt.value = genzOriginal;
      genzOriginal = null;
    }
  };

  function setStatus(text, kind){
    refs.status.textContent = text || '';
    refs.status.classList.remove('ok', 'err');
    if (kind) refs.status.classList.add(kind);
  }

  function showInViewer(b64, mime){
    refs.viewer.innerHTML = '';
    const img = new Image();
    img.src = `data:${mime || 'image/png'};base64,${b64}`;
    refs.viewer.appendChild(img);
  }

  function base64FromFile(file){
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => {
        const m = String(fr.result).match(/^data:(.+);base64,(.*)$/);
        if (!m) return reject("parse");
        resolve({ mime: m[1], base64: m[2] });
      };
      fr.onerror = () => reject(fr.error);
      fr.readAsDataURL(file);
    });
  }

  async function base64FromFileResized(file, max=512){
    const url = URL.createObjectURL(file);
    const img = await new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => resolve(im);
      im.onerror = () => reject("load");
      im.src = url;
    });
    const w = img.width, h = img.height;
    const sc = Math.min(1, max / Math.max(w, h));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(w * sc);
    canvas.height = Math.round(h * sc);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL(file.type.includes('png') ? 'image/png' : 'image/jpeg', 0.9);
    URL.revokeObjectURL(url);
    const m = dataUrl.match(/^data:(.+);base64,(.*)$/);
    return { mime: m[1], base64: m[2] };
  }

  function renderRefStrip(files){
    refs.refStrip.innerHTML = '';
    if (!files || !files.length) {
      refs.refCount.textContent = '';
      return;
    }
    [...files].forEach(f => {
      const url = URL.createObjectURL(f);
      const img = new Image();
      img.src = url;
      img.className = 'refthumb';
      img.onload = () => URL.revokeObjectURL(url);
      refs.refStrip.appendChild(img);
    });
    refs.refCount.textContent = `${files.length}장 첨부됨`;
  }

  refs.file.onchange = e => renderRefStrip(e.target.files);
  refs.clearRefs.onclick = () => {
    refs.file.value = '';
    refs.refStrip.innerHTML = '';
    refs.refCount.textContent = '';
  };

  const galleryItems = [];
  let seq = 0;
  let currentSelectedId = null;

  function addToGallery(base64, mime){
    const ts = new Date().toISOString().replace(/[:.]/g,'-');
    const id = `${ts}-${++seq}`;
    galleryItems.unshift({ id, base64, mime: mime || 'image/png', ts });
    renderGallery();
    setSelection(id);
  }

  function getIndexById(id){
    return galleryItems.findIndex(x => x.id === id);
  }

  function selectByIndex(idx){
    if (idx < 0 || idx >= galleryItems.length) return;
    setSelection(galleryItems[idx].id);
  }

  function setSelection(id){
    currentSelectedId = id;
    const it = galleryItems.find(x => x.id === id);
    if (it) {
      showInViewer(it.base64, it.mime);
      refs.b64.value = it.base64;
      updateActionState(true);
    } else {
      refs.viewer.innerHTML = '<div style="color:#888">선택 없음</div>';
      refs.b64.value = '';
      updateActionState(false);
    }
    [...refs.gallery.querySelectorAll('.card')].forEach(card => {
      card.classList.toggle('sel', card.getAttribute('data-id') === currentSelectedId);
    });
  }

  function renderGallery(){
    refs.gallery.innerHTML = galleryItems.map((it, idx) => `
      <div class="card ${it.id === currentSelectedId ? 'sel' : ''}" data-id="${it.id}">
        <img src="data:${it.mime};base64,${it.base64}" alt="result ${idx+1}">
        <div class="meta">
          <span class="badge">#${idx+1}</span>
          <span style="color:#666;font-size:.8rem">${it.mime.includes('png') ? 'PNG' : 'JPG'}</span>
        </div>
      </div>
    `).join('');
    [...refs.gallery.querySelectorAll('.card')].forEach(card => {
      card.addEventListener('click', () => setSelection(card.getAttribute('data-id')));
    });
  }

  function updateActionState(hasSel){
    refs.save.disabled = !hasSel;
    refs.copyB64.disabled = !hasSel;
    refs.openDataUrl.disabled = !hasSel;
  }

  refs.navNewer.onclick = () => {
    if (!galleryItems.length) return setStatus('갤러리가 비어있어요', 'err');
    if (!currentSelectedId) return selectByIndex(0);
    const idx = getIndexById(currentSelectedId);
    if (idx <= 0) return setStatus('최신 항목입니다', 'ok');
    selectByIndex(idx - 1);
  };

  refs.navOlder.onclick = () => {
    if (!galleryItems.length) return setStatus('갤러리가 비어있어요', 'err');
    if (!currentSelectedId) return selectByIndex(galleryItems.length - 1);
    const idx = getIndexById(currentSelectedId);
    if (idx >= galleryItems.length - 1) return setStatus('가장 과거 항목입니다', 'ok');
    selectByIndex(idx + 1);
  };

  refs.clearGallery.onclick = () => {
    galleryItems.splice(0, galleryItems.length);
    currentSelectedId = null;
    renderGallery();
    setSelection(null);
  };

  function saveBase64(b64, mime, filename){
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const blob = new Blob([arr], { type: mime || 'image/png' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename || `gemini-${Date.now()}.${(mime || 'image/png').includes('png') ? 'png' : 'jpg'}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  refs.save.onclick = () => {
    const it = galleryItems.find(x => x.id === currentSelectedId);
    if (!it) return;
    const ext = it.mime.includes('png') ? 'png' : (it.mime.includes('jpeg') ? 'jpg' : 'png');
    saveBase64(it.base64, it.mime, `gemini-${it.ts}.${ext}`);
  };
  refs.copyB64.onclick = () => {
    const it = galleryItems.find(x => x.id === currentSelectedId);
    if (it) navigator.clipboard.writeText(it.base64);
  };
  refs.openDataUrl.onclick = () => {
    const it = galleryItems.find(x => x.id === currentSelectedId);
    if (it) window.open(`data:${it.mime};base64,${it.base64}`, '_blank');
  };

  const WATCHDOG_MS = 600000;
  const RETRY_DELAY_MS = 1000;
  const RETRY_DELAY_SEC = Math.round(RETRY_DELAY_MS / 1000);
  const MAX_INTERNAL = 10;

  let currentControllers = [];
  let watchdogTimer = null;
  let stopRequested = false;

  function setBusy(isBusy){
    refs.spin.style.display = isBusy ? 'inline' : 'none';
    refs.go.disabled = isBusy;
    refs.stop.disabled = !isBusy;
    const disable = isBusy;
    [
      refs.save, refs.copyB64, refs.openDataUrl,
      refs.endpoint, refs.token, refs.file, refs.shrink, refs.clearRefs,
      refs.prompt, refs.retrySafetySel, refs.multiMode, refs.multiCount, refs.parallelCount,
      ...Object.values(refs.s),
      refs.genz.e, refs.genz.g, refs.genz.l, refs.genz.s, refs.genz.o, refs.genz.a, refs.genz.leet, refs.genz.reset,
      refs.clearGallery, refs.navNewer, refs.navOlder
    ].forEach(el => el.disabled = disable);
  }

  function clearWatchdog(){
    if (watchdogTimer) {
      clearTimeout(watchdogTimer);
      watchdogTimer = null;
    }
  }

  function abortInFlight(reason='사용자 정지'){
    stopRequested = true;
    currentControllers.forEach(c => { try { c.abort(); } catch {} });
    currentControllers = [];
    clearWatchdog();
    setBusy(false);
    setStatus(`요청 취소됨: ${reason}`, 'ok');
    refs.go.textContent = '이미지 만들기';
  }

  refs.stop.onclick = () => abortInFlight('정지 버튼 클릭');

  function isInternalError(resp, json){
    const http500 = resp && resp.status === 500;
    const google500 = json && (json.googleStatus === 500 || json?.googleError?.code === 500);
    const internalTag =
      (json?.googleError?.status === 'INTERNAL') ||
      (json?.error && typeof json.error === 'object' && json.error.status === 'INTERNAL') ||
      (typeof json?.error === 'string' && json.error.includes('Internal error encountered')) ||
      (json?.googleError?.message === 'Internal error encountered.') ||
      (json?.error?.message === 'Internal error encountered.');
    return http500 || google500 || internalTag;
  }

  function isImageSafetyFailure(json){
    const c1 = Array.isArray(json?.raw?.candidates) ? json.raw.candidates : [];
    const c2 = Array.isArray(json?.candidates) ? json.candidates : [];
    const arr = c1.length ? c1 : c2;
    return arr.some(c => c?.finishReason === 'IMAGE_SAFETY');
  }

  async function doOneRequest(payload){
  const controller = new AbortController();
  currentControllers.push(controller);

  const headers = { 'Content-Type':'application/json' };

  try {
    const resp = await fetch(refs.endpoint.value, {
      method:'POST',
      headers,
      body: JSON.stringify(payload),
      signal: controller.signal
    });

    const json = await resp.json().catch(() => ({ error:'JSON 파싱 실패' }));

    refs.raw.value = json.raw
      ? JSON.stringify(json.raw, null, 2)
      : JSON.stringify(json, null, 2);

    // 성공 조건: 이미지가 실제로 왔을 때만
    if (json.image_base64) {
      addToGallery(json.image_base64, json.mime_type || 'image/png');
      return { ok:true };
    }

    // 이미지가 없으면 이유 불문 전부 재시도 대상으로 처리
    return {
      ok:false,
      type:'retryable',
      message: json?.error
        ? (typeof json.error === 'string' ? json.error : (json.error.message || '이미지 없음'))
        : '이미지가 도착하지 않음'
    };

  } catch (err) {
    if (err.name === 'AbortError') return { ok:false, aborted:true };

    // fetch 실패도 재시도 대상으로 처리
    return {
      ok:false,
      type:'retryable',
      message:'오류: ' + err
    };
  } finally {
    currentControllers = currentControllers.filter(c => c !== controller);
  }
}

  async function doOneRequestWithRetry(payload, maxRetry){
  let retryCount = 0;

  while (!stopRequested) {
    const r = await doOneRequest(payload);

    if (r.ok) {
      return { ok:true, retryTotal: retryCount };
    }

    if (r.aborted) {
      return { ok:false, aborted:true, retryTotal: retryCount };
    }

    if (retryCount < maxRetry) {
      retryCount++;
      setStatus(`이미지가 없어 재시도 중… ${retryCount}/${maxRetry}`, 'err');
      await delay(RETRY_DELAY_MS);
      continue;
    }

    if (r.message) setStatus(r.message, 'err');
    return { ok:false, retryTotal: retryCount };
  }

  return { ok:false, aborted:true, retryTotal: retryCount };
}

  function delay(ms){
    return new Promise(async resolve => {
      let waited = 0;
      while (waited < ms && !stopRequested) {
        await new Promise(r => setTimeout(r, 100));
        waited += 100;
      }
      resolve();
    });
  }

  refs.go.onclick = async () => {
    stopRequested = false;
    refs.go.textContent = '이미지 만들기';
    setStatus('', '');
    setBusy(true);

    clearWatchdog();
    watchdogTimer = setTimeout(() => abortInFlight('타임아웃'), WATCHDOG_MS);

    try {
      let imagesArr = [];
      if (refs.file.files && refs.file.files.length > 0) {
        const files = [...refs.file.files];
        imagesArr = await Promise.all(files.map(f =>
          refs.shrink.checked ? base64FromFileResized(f) : base64FromFile(f)
        ));
      }

      const safety = {};
      Object.entries(refs.s).forEach(([k, sel]) => {
        if (sel.value) safety[k] = sel.value;
      });

      const basePayload = {
        prompt: refs.prompt.value,
        image: imagesArr[0] || undefined,
        images: imagesArr.length ? imagesArr : undefined,
        safety: Object.keys(safety).length ? safety : undefined
      };

      const target = refs.multiMode.checked ? parseInt(refs.multiCount.value || '1', 10) : 1;
      const parallel = Math.max(1, Math.min(10, parseInt(refs.parallelCount.value || '1', 10)));
      const maxSafetyRetry = parseInt(refs.retrySafetySel.value || '0', 10);

      let successSoFar = 0;

      while (!stopRequested) {
        refs.go.textContent = `이미지 만들기 (연속 ${successSoFar}/${target} · 병렬 ${parallel})`;
        setStatus(`병렬 ${parallel}개 요청 중…`, 'ok');

        const tasks = Array.from({ length: parallel }, () => doOneRequestWithRetry(basePayload, maxSafetyRetry));
        const results = await Promise.all(tasks);

        const batchSuccess = results.filter(r => r.ok).length;
        const batchRetrySum = results.reduce((sum, r) => sum + (r.retryTotal || 0), 0);

        successSoFar += batchSuccess;

        if (batchSuccess > 0) {
          setStatus(`완료 ${batchSuccess}개 추가 · 누적 ${successSoFar}/${target} · 배치 재시도 ${batchRetrySum}회`, 'ok');
        } else if (!stopRequested) {
          setStatus(`이번 배치 성공 0개 · 누적 ${successSoFar}/${target}`, 'err');
        }

        // 핵심 변경: 목표 이상이면 종료
        if (successSoFar >= target) break;

        if (!stopRequested) await delay(RETRY_DELAY_MS);
      }
    } catch (e) {
      setStatus('오류: ' + e, 'err');
    } finally {
      clearWatchdog();
      currentControllers.forEach(c => { try { c.abort(); } catch {} });
      currentControllers = [];
      setBusy(false);
      refs.go.textContent = '이미지 만들기';
      const hasSel = !!galleryItems.find(x => x.id === currentSelectedId);
      updateActionState(hasSel);
    }
  };
})();
</script>
